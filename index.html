<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151719">
  <meta name="description" content="自定义 NETDIR 霓虹终端画面，保留原始背景与字幕。">
  <title>NETDIR // 自定义终端</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23171919'/%3E%3Cpath d='M15 48V16h7l20 32h7V16' fill='none' stroke='%2300ffe4' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="screen" aria-label="NETDIR 终端画面">
    <div class="scene" id="scene">
      <img class="background" src="./assets/background.png" width="1754" height="987" alt="灰色扫描线背景、白色抽象标志和青色发光边框。底部字幕：我做的专门用于爆料的平台，绝对万无一失。" draggable="false">
      <canvas id="lettering" width="1754" height="987" role="img" aria-label="NETDIR://XXXXXXX.WEB"></canvas>
      <button id="edit-text" class="text-hit-area" aria-label="编辑中央文字" title="点击修改文字（快捷键 E）"></button>
    </div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <form id="settings-form">
      <header><div><p class="eyebrow">NETDIR / DISPLAY SETTINGS</p><h1 id="settings-title">自定义画面</h1></div><button type="button" id="close-settings" class="close" aria-label="关闭设置">×</button></header>
      <label for="custom-text">中央文字</label>
      <input id="custom-text" name="text" type="text" maxlength="100" autocomplete="off" spellcheck="false" value="NETDIR://XXXXXXX.WEB" dir="auto">
      <p class="hint">输入完整文字，例如 NETDIR://YOURNAME.WEB。点击画面中央或按 E 可再次编辑。</p>
      <div class="range-heading"><label for="glitch">文字故障效果</label><output id="glitch-value" for="glitch">0%</output></div>
      <input id="glitch" name="glitch" type="range" min="0" max="100" value="0">
      <p class="hint">默认不偏移，保留明亮发光与轻微扫描线；提高数值可添加文字错位。</p>
      <div class="actions"><button type="button" id="copy-link">复制分享链接</button><button type="button" id="download">下载图片</button></div>
      <div class="footer-actions"><button type="button" id="reset" class="quiet">恢复默认</button><button type="submit" class="primary">完成</button></div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </dialog>
  <noscript><p class="noscript">请启用 JavaScript 以显示和修改中央文字。</p></noscript>
</body>
</html>
